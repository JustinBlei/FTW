<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiederholungstracker</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reps">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main"></main>

<div id="rest" class="rest" hidden>
  <div class="rest-fill" id="rest-fill"></div>
  <span class="muted small">Pause</span>
  <b id="rest-time">0:00</b>
  <button data-act="restAdj" data-n="-15">−15</button>
  <button data-act="restAdj" data-n="15">+15</button>
  <button data-act="restSkip">Weiter</button>
</div>

<div id="toast" class="toast" hidden></div>

<nav class="tabs">
  <button data-act="tab" data-tab="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
    <span>Training</span>
  </button>
  <button data-act="tab" data-tab="day">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Tag</span>
  </button>
  <button data-act="tab" data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4.5-4.5 3.5 3L19 7"/></svg>
    <span>Fortschritt</span>
  </button>
  <button data-act="tab" data-tab="more">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<div id="sheet" class="sheet-wrap" hidden><div class="sheet" id="sheet-body"></div></div>

<script src="app.js"></script>
</body>
</html>
